name: Daily HNTED waterfowl data

on:
  schedule:
    - cron: '17 4 * * *'
      timezone: America/Chicago
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: hnted-waterfowl-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check daily freshness and live publication
        id: health
        run: node scripts/check-hnted-waterfowl-health.mjs --probe-live
      - name: Install PDF reader for validated survey imports
        if: steps.health.outputs.needed == 'true'
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Refresh weather, ground observations, and agency report sources
        if: steps.health.outputs.needed == 'true'
        run: node scripts/refresh-hnted-waterfowl.mjs
      - name: Validate saved data and runtime
        run: node scripts/verify-hnted-waterfowl.mjs
      - name: Save only generated public snapshots
        if: steps.health.outputs.needed == 'true'
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- hnted/waterfowl/data/weather.json hnted/waterfowl/data/conditions.json hnted/waterfowl/data/surveys.json hnted/waterfowl/data/update-status.json data/hnted-waterfowl/waterfowl-surveys.json data/hnted-waterfowl/waterfowl-illinois.json data/hnted-waterfowl/waterfowl-missouri.json data/hnted-waterfowl/waterfowl-northern.json data/hnted-waterfowl/waterfowl-southern.json data/hnted-waterfowl/waterfowl-source-status.json data/hnted-waterfowl/waterfowl-additional.json data/hnted-waterfowl/waterfowl-east-tn-in.json data/hnted-waterfowl/waterfowl-east-ky-ms.json data/hnted-waterfowl/waterfowl-monitoring.json 'hnted/waterfowl/data/snow-analysis-*.png'
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Refresh dated HNTED waterfowl data'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the updated branch through GitHub Pages
        if: steps.save.outputs.changed == 'true' || steps.health.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-hnted-waterfowl-data.mjs
      - name: Verify fresh data is actually live
        run: node scripts/check-hnted-waterfowl-health.mjs --require-fresh --live --wait-live

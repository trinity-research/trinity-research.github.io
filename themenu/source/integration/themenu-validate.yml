name: Validate theMenu component
on:
  pull_request:
    paths:
      - 'themenu/**'
      - '.github/workflows/themenu-validate.yml'
      - '.github/ISSUE_TEMPLATE/themenu-menu-correction.yml'
  push:
    branches: [main, 'feature/themenu-*']
    paths:
      - 'themenu/**'
      - '.github/workflows/themenu-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: themenu/source
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B scripts/validate_data.py
      - run: python -B scripts/validate_data.py data/demo.json --demo
      - run: python -B -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/core.test.js
      - run: python -B scripts/export_trinity.py --check
      - run: python -B scripts/build.py
      - name: Save reviewable static preview (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: themenu-static-preview
          path: themenu/source/dist
          retention-days: 14
